name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional repository secret holding the shared debug signing key (docs/going-public.md).
      HARNESS_DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      # The committed debug key is only acceptable while the repository is private.
      - name: Public repository guard
        if: ${{ github.event.repository.private == false }}
        run: |
          if [ -f app/debug.keystore ]; then
            echo "::error file=app/debug.keystore::This repository is public but the shared debug signing key is still committed. Follow docs/going-public.md before building."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null

      - name: Unit tests (core + Robolectric)
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: ai-harness-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Last, because R8 over the Anthropic SDK is slow; it catches shrinking problems.
      - name: Build release APK (R8 check)
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
