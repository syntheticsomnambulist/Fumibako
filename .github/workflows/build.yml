name: Build

on:
  # A push or pull request that only changes notes and plans needs no build.
  push:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional repository secret holding the shared debug signing key (docs/going-public.md).
      HARNESS_DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      # The committed debug key is only acceptable while the repository is private.
      - name: Public repository guard
        if: ${{ github.event.repository.private == false }}
        run: |
          if [ -f app/debug.keystore ]; then
            echo "::error file=app/debug.keystore::This repository is public but the shared debug signing key is still committed. Follow docs/going-public.md before building."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null

      - name: Unit tests (core, the database on both SQLites, Robolectric)
        run: ./gradlew :core:test :data:desktopTest :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: fumibako-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Last, because R8 over the Anthropic SDK is slow; it catches shrinking problems.
      - name: Build release APK (R8 check)
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            data/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  # The desktop app (docs/plan-desktop.md): its tests, and an installer for each system.
  # Builds without the Android SDK.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Desktop tests
        run: ./gradlew :data:desktopTest :desktop:test

      - name: Debian packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot

      - name: Desktop installer
        run: ./gradlew :desktop:packageDistributionForCurrentOS

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: fumibako-desktop-${{ runner.os }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-reports-${{ runner.os }}-${{ github.run_number }}
          path: |
            data/build/reports/tests/
            desktop/build/reports/tests/
          if-no-files-found: ignore
