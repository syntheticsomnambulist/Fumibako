  <g id="box">
    <rect x="5" y="54" width="110" height="23" rx="3" fill="#bd8d9e"></rect>
    <rect x="27.5" y="58" width="5" height="19" fill="#e3ccce"></rect>
    <rect x="5" y="9" width="110" height="51" rx="3" fill="#bd8d9e"></rect>
    <rect x="10" y="14" width="100" height="44" fill="#d7b6be"></rect>
    <rect x="10" y="14" width="100" height="8" fill="#bd8d9e"></rect>
    <polygon points="10,14 16,22 16,58 10,58" fill="#caa1ae"></polygon>
    <polygon points="110,14 104,22 104,58 110,58" fill="#caa1ae"></polygon>
  </g>
  <g id="lid">
    <rect x="0" y="38" width="120" height="22" rx="5" fill="#af788f"></rect>
    <rect x="0" y="2" width="120" height="48" rx="6" fill="#bd8d9e"></rect>
    <rect x="4" y="5.5" width="112" height="43" rx="4" fill="none" stroke="#d7b6be" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"></rect>
    <rect x="27.5" y="1" width="5" height="59" fill="#e3ccce"></rect>
    <text x="79" y="33.84" text-anchor="middle" font-family="Zen Old Mincho" font-weight="600" font-size="19" fill="#774b03">Aria</text>
    <text x="79" y="32.84" text-anchor="middle" font-family="Zen Old Mincho" font-weight="600" font-size="19" fill="#e9a853">Aria</text>
  </g>
  <g id="bow">
    <circle cx="30" cy="25" r="5" fill="#e3ccce"></circle>
    <circle cx="30" cy="25" r="2.2" fill="none" stroke="#caa1ae" stroke-width="1" stroke-linecap="round" stroke-linejoin="miter"></circle>
  </g>
  <g id="box">
